name: Build and Release Wails 3 App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'Windows x64'
            os: 'windows-latest'
          - name: 'macOS Universal'
            os: 'macos-latest'
          - name: 'Linux x64'
            os: 'ubuntu-latest'

    runs-on: ${{ matrix.build.os }}
    name: ${{ matrix.build.name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            build-essential \
            pkg-config

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      # === 构建（所有平台统一使用根 Taskfile 的 build:prod）===
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          task build:prod APP_VERSION=$VERSION

      # === 打包（各平台不同）===
      - name: Package (Windows) - NSIS Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          task package:prod APP_VERSION=$version

      - name: Package (macOS) - .app Bundle + .zip
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          task darwin:package APP_VERSION=$VERSION
          cd bin
          zip -r "myapp2-${VERSION}-macOS.zip" "myapp2.app"

      - name: Package (Linux) - .deb + .rpm + .AppImage
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          task linux:package APP_VERSION=$VERSION

      # === 上传产物 ===
      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: |
            bin/*.exe
          if-no-files-found: warn

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: |
            bin/*.zip
            bin/*.dmg
          if-no-files-found: warn

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
            bin/myapp2
          if-no-files-found: warn

  # === GitHub Release（将各平台产物一并发布）===
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Windows/*
            macOS/*
            Linux/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
