name: Build Wails 3 App

on:
  push:
    tags:
      - 'v*' # 当推送版本标签（如 v1.0.0）时触发部署流程
  workflow_dispatch: # 允许手动在 GitHub 页面点击运行

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 定义全方位的架构支持
        build:
          - name: 'Windows x64'
            os: 'windows-latest'
            package: 'windows/amd64'
            arch: 'amd64'
          - name: 'Windows ARM64'
            os: 'windows-latest'
            package: 'windows/arm64'
            arch: 'arm64'
          - name: 'macOS Universal (Intel + Silicone)'
            os: 'macos-latest'
            package: 'darwin/universal'
            arch: 'universal'
          - name: 'Linux x64'
            os: 'ubuntu-latest'
            package: 'linux/amd64'
            arch: 'amd64'
          - name: 'Linux ARM64'
            os: 'ubuntu-latest'
            package: 'linux/arm64'
            arch: 'arm64'

    runs-on: ${{ matrix.build.os }}
    name: ${{ matrix.build.name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install System Dependencies (Linux Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # 安装基础构建库
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
          # 如果目标是 ARM64，安装交叉编译工具链
          if [[ "${{ matrix.build.package }}" == *"arm64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config-aarch64-linux-gnu
          fi

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails@latest

      - name: Build with Task
        run: |
          # 提取版本号（从 Tag 获取，如果没有 Tag 则默认 1.0.0）
          APP_VERSION=${GITHUB_REF#refs/tags/v}
          if [[ $APP_VERSION == refs* ]]; then APP_VERSION="1.0.0"; fi
          
          echo "Building version: $APP_VERSION for ${{ matrix.build.arch }}"
          
          # 根据不同平台动态设置交叉编译变量
          export CGO_ENABLED=1
          if [[ "${{ matrix.build.package }}" == "linux/arm64" ]]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
          fi
          
          # 使用项目自带的 Taskfile 进行生产级构建
          task build:prod ARCH=${{ matrix.build.arch }} APP_VERSION=$APP_VERSION

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}-build
          path: |
            build/bin/*
            *.exe
            *.app
            *.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
