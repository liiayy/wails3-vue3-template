name: Build and Release Wails 3 App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'Windows x64'
            os: 'windows-latest'
            artifact-name: 'Windows'
            arch: 'amd64'
          - name: 'macOS Universal'
            os: 'macos-latest'
            artifact-name: 'macOS'
            arch: 'universal'
          - name: 'Linux x64'
            os: 'ubuntu-latest'
            artifact-name: 'Linux-x64'
            arch: 'amd64'
          - name: 'Linux arm64'
            os: 'ubuntu-24.04-arm'
            artifact-name: 'Linux-arm64'
            arch: 'arm64'

    runs-on: ${{ matrix.build.os }}
    name: ${{ matrix.build.name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './frontend/pnpm-lock.yaml'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            build-essential \
            pkg-config

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.94

      # === 构建（所有平台统一使用根 Taskfile 的 build:prod）===
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          task build:prod APP_VERSION=$VERSION

      # === 打包（各平台不同）===
      - name: Package (Windows) - NSIS Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          task package:prod APP_VERSION=$version
          Rename-Item -Path "bin/myapp2-amd64-installer.exe" -NewName "myapp2-$version-windows-amd64.exe"
          Compress-Archive -Path "bin/myapp2.exe" -DestinationPath "bin/myapp2-$version-windows-amd64.zip"
          Remove-Item -Path "bin/myapp2.exe"

      - name: Package (macOS) - .app Bundle + .zip
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          task package:prod APP_VERSION=$VERSION
          cd bin
          mv "myapp2-${VERSION}-macOS.dmg" "myapp2-${VERSION}-macOS-universal.dmg"
          zip -r "myapp2-${VERSION}-macOS-universal.zip" "myapp2.app"
          rm -rf "myapp2.app"

      - name: Package (Linux) - .deb + .rpm + .AppImage
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          task package:prod APP_VERSION=$VERSION
          cd bin
          ARCH="${{ matrix.build.arch }}"
          mv myapp2.deb "myapp2-${VERSION}-linux-${ARCH}.deb"
          mv myapp2.rpm "myapp2-${VERSION}-linux-${ARCH}.rpm"
          if [ -f myapp2-x86_64.AppImage ]; then
            mv myapp2-x86_64.AppImage "myapp2-${VERSION}-linux-${ARCH}.AppImage"
          elif [ -f myapp2-aarch64.AppImage ]; then
            mv myapp2-aarch64.AppImage "myapp2-${VERSION}-linux-${ARCH}.AppImage"
          fi
          rm -f myapp2

      # === 上传产物 ===
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.artifact-name }}
          path: |
            bin/*.exe
            bin/*.zip
            bin/*.dmg
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
          if-no-files-found: warn

  # === GitHub Release（将各平台产物一并发布）===
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Windows/*
            macOS/*
            Linux-x64/*
            Linux-arm64/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
